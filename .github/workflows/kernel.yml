name: Kernel Build

on:
  push:
    branches: [main, agent/**]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-27
          target: x86_64-unknown-none
          components: rust-src, llvm-tools-preview, rustfmt
          rustflags: ""
      - name: Format workspace
        run: cargo fmt --all
      - name: Check formatting changes
        run: git diff --check
      - name: Run host-side kernel tests
        run: cargo test -p x11-os-kernel --lib
      - name: Check kernel binary
        shell: bash
        env:
          RUSTFLAGS: "-D warnings -A dead_code"
        run: |
          set -o pipefail
          set +e
          cargo check -p x11-os-kernel --bin x11-os-kernel --target x86_64-unknown-none 2>&1 | tee cargo-check.log
          check_status=${PIPESTATUS[0]}
          set -e
          echo '--- compiler error summary ---'
          grep -E '^error([[]E[0-9]+[]])?:|^ *--> ' cargo-check.log | head -n 240 || true
          echo '--- end compiler error summary ---'
          python3 - <<'PY'
          import re
          from pathlib import Path

          current = None
          count = 0
          for line in Path("cargo-check.log").read_text(errors="replace").splitlines():
              if re.match(r"^error(?:\[E\d+\])?:", line):
                  current = line.strip()
                  continue
              match = re.match(r"^\s*-->\s+([^:]+):(\d+):(\d+)", line)
              if match and current and count < 100:
                  path, row, col = match.groups()
                  safe = current.replace("\r", "").replace("\n", " ")
                  print(f"::error file={path},line={row},col={col}::{safe}")
                  count += 1
          PY
          exit "$check_status"
      - name: Build UEFI image
        run: cargo build -p x11-os-boot
      - name: Install QEMU and UEFI firmware
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Boot kernel and verify timer preemption paths
        shell: bash
        run: |
          set -o pipefail
          image="$(cargo run -q -p x11-os-boot | sed -n 's/^X11-OS UEFI image: //p')"
          test -n "$image"
          firmware="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' | head -n 1)"
          test -n "$firmware"
          set +e
          timeout 12s qemu-system-x86_64 \
            -bios "$firmware" \
            -drive "format=raw,file=$image" \
            -serial stdio \
            -display none \
            2>&1 | tee qemu.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          test "$qemu_status" -eq 124
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("qemu.log").read_text(errors="replace")
          forbidden = [
              "X11-OS: KERNEL PANIC",
              "[x11-os] double fault",
              "[x11-os] page fault",
          ]
          for marker in forbidden:
              if marker in log:
                  raise SystemExit(f"forbidden runtime marker observed: {marker}")

          required = [
              "X11-OS: kernel entry reached",
              "X11-OS: CPU foundation initialized",
              "X11-OS: invariant TSC clocksource available",
              "X11-OS: ACPI MADT discovered",
              "X11-OS: legacy 8259 masked",
              "X11-OS: local APIC mode =",
              "X11-OS: Local APIC EOI initialized",
              "X11-OS: LAPIC timer calibrated Hz =",
              "X11-OS: LAPIC periodic timer enabled at 100 Hz",
              "X11-OS: heap initialized",
              "X11-OS: heap allocation verified",
              "X11-OS: kernel runtime bound to CPU0",
              "X11-OS: preemption proof tasks armed",
              "X11-OS: interrupts remain disabled until task B starts",
              "X11-OS: task A started",
              "X11-OS: task B started",
              "X11-OS: interrupts enabled in task B",
              "X11-OS: task A resumed after timer preemption",
              "X11-OS: task B resumed through kernel iretq",
              "X11-OS: timer ticks observed after iretq =",
          ]

          position = -1
          for marker in required:
              next_position = log.find(marker, position + 1)
              if next_position < 0:
                  raise SystemExit(f"missing or out-of-order runtime marker: {marker}")
              position = next_position

          tick_match = re.search(r"timer ticks observed after iretq = (\d+)", log)
          if not tick_match or int(tick_match.group(1)) < 2:
              raise SystemExit("timer tick evidence is below the two-interrupt preemption proof")

          print("QEMU runtime marker order and two-timer preemption evidence verified")
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ci-diagnostics
          path: |
            cargo-check.log
            qemu.log
          if-no-files-found: ignore
