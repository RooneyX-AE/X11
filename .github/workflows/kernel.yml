name: Kernel Build

on:
  push:
    branches: [main, agent/**]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-27
          target: x86_64-unknown-none
          components: rust-src, llvm-tools-preview, rustfmt
          rustflags: ""
      - name: Format workspace
        run: cargo fmt --all
      - name: Check formatting changes
        run: git diff --check
      - name: Run shared ABI tests
        run: cargo test -p x11-os-abi --lib
      - name: Check shared ABI target
        run: cargo check -p x11-os-abi --target x86_64-unknown-none
      - name: Run host-side kernel tests
        run: cargo test -p x11-os-kernel --lib
      - name: Run userspace payload tests
        run: cargo test -p x11-os-user-hello --lib
      - name: Check userspace payload target
        run: cargo check -p x11-os-user-hello --target x86_64-unknown-none
      - name: Build userspace ELF payload
        run: cargo build -p x11-os-user-hello --bin x11-os-user-hello --target x86_64-unknown-none
      - name: Verify userspace ELF type
        shell: bash
        run: |
          set -euo pipefail
          payload="target/x86_64-unknown-none/debug/x11-os-user-hello"
          test -f "$payload"
          readelf -h "$payload" | tee userspace-elf-header.txt
          readelf -h "$payload" | grep -Eq 'Type:.*EXEC'
      - name: Check kernel binary
        shell: bash
        env:
          RUSTFLAGS: "-D warnings -A dead_code"
        run: |
          set -o pipefail
          set +e
          cargo check -p x11-os-kernel --bin x11-os-kernel --target x86_64-unknown-none 2>&1 | tee cargo-check.log
          check_status=${PIPESTATUS[0]}
          set -e
          echo '--- compiler error summary ---'
          grep -E '^error([[]E[0-9]+[]])?:|^ *--> ' cargo-check.log | head -n 240 || true
          echo '--- end compiler error summary ---'
          exit "$check_status"
      - name: Build UEFI image
        run: cargo build -p x11-os-boot
      - name: Install QEMU and UEFI firmware
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          firmware="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' -readable | head -n 1)"
          test -n "$firmware"
          test -s "$firmware"
          file "$firmware"
          ls -l "$firmware"
          cp "$firmware" "$GITHUB_WORKSPACE/OVMF_CODE.fd"
          chmod 0644 "$GITHUB_WORKSPACE/OVMF_CODE.fd"
          test -s "$GITHUB_WORKSPACE/OVMF_CODE.fd"
      - name: Boot kernel and verify userspace ring3 syscall path
        shell: bash
        run: |
          set -o pipefail
          image="$(cargo run -q -p x11-os-boot | sed -n 's/^X11-OS UEFI image: //p')"
          test -n "$image"
          firmware="$GITHUB_WORKSPACE/OVMF_CODE.fd"
          test -r "$firmware"
          test -s "$firmware"
          set +e
          timeout 12s qemu-system-x86_64 \
            -no-reboot \
            -bios "$firmware" \
            -drive "format=raw,file=$image" \
            -serial stdio \
            -display none \
            2>&1 | tee qemu.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          test "$qemu_status" -eq 124
          python3 - <<'PY'
          from pathlib import Path

          log = Path("qemu.log").read_text(errors="replace")
          forbidden = [
              "X11-OS: KERNEL PANIC",
              "[x11-os] double fault",
              "[x11-os] page fault",
          ]
          for marker in forbidden:
              if marker in log:
                  raise SystemExit(f"forbidden runtime marker observed: {marker}")

          required = [
              "X11-OS: kernel entry reached",
              "Hello World from X11-OS!",
              "X11-OS: CPU foundation initialized",
              "X11-OS: userspace ramdisk loaded bytes =",
              "X11-OS: userspace ELF validated segments =",
              "X11-OS: userspace process image prepared",
              "X11-OS: heap initialized",
              "X11-OS: heap allocation verified",
              "X11-OS: userspace address space populated",
              "X11-OS: userspace launch prepared",
          ]
          position = -1
          for marker in required:
              next_position = log.find(marker, position + 1)
              if next_position < 0:
                  raise SystemExit(f"missing or out-of-order runtime marker: {marker}")
              position = next_position

          trap_marker = "X11-OS: userspace int 0x80 trap reached"
          if log.count(trap_marker) != 3:
              raise SystemExit(f"expected exactly three userspace trap markers, found {log.count(trap_marker)}")

          write_marker = "Hello from X11-OS userspace!"
          if log.count(write_marker) != 2:
              raise SystemExit(f"expected exactly two userspace write outputs, found {log.count(write_marker)}")

          abi_marker = "X11-OS: syscall ABI return contract verified"
          if log.count(abi_marker) != 1:
              raise SystemExit(f"expected exactly one syscall ABI verification marker, found {log.count(abi_marker)}")

          print("QEMU evidence: CPL3 userspace executed Write twice, validated success and error RAX ABI, and returned to userspace after every trap")
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ci-diagnostics
          path: |
            cargo-check.log
            qemu.log
            userspace-elf-header.txt
          if-no-files-found: ignore
